# Render Blueprint — deploy "Dairy Management System" with one click.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: dairy-db
    databaseName: dairy
    user: dairy
    plan: free
    ipAllowList: [] # only allow internal connections

services:
  - type: web
    name: dairy-management
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /ok
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-db
          property: connectionString
