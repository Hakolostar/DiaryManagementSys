{% extends "base.html" %}
{% block title %}Delete record{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <div class="mt-10 rounded-xl border border-gray-200 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-100 text-rose-600">
      {% include "components/icon.html" with name="trash" class="w-8 h-8" %}
    </div>
    <h1 class="mt-4 text-xl font-bold text-gray-900">Delete this record?</h1>
    <p class="mt-2 text-sm text-gray-500">You are about to delete <strong class="text-gray-700">{{ object }}</strong>. This action cannot be undone.</p>
    <form method="post" class="mt-6 flex justify-center gap-3">
      {% csrf_token %}
      <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
      <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">Delete</button>
    </form>
  </div>
</div>
{% endblock %}
