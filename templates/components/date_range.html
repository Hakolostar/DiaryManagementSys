<form method="get" class="mb-4 flex flex-wrap items-center gap-3">
  <label for="from" class="text-sm font-medium text-gray-600">From</label>
  <input type="date" id="from" name="from" value="{{ start_date|date:'Y-m-d' }}" class="rounded-lg border border-gray-300 bg-white py-2 px-3 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
  <label for="to" class="text-sm font-medium text-gray-600">To</label>
  <input type="date" id="to" name="to" value="{{ end_date|date:'Y-m-d' }}" class="rounded-lg border border-gray-300 bg-white py-2 px-3 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
  <button type="submit" class="rounded-lg bg-gray-800 px-4 py-2 text-sm font-medium text-white">Apply</button>
</form>
