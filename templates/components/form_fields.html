{% for field in form %}
  <div class="mb-4">
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-gray-700">
      {{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-gray-400">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="mt-1 text-sm text-rose-600">{{ field.errors.0 }}</p>{% endif %}
  </div>
{% endfor %}
