<div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500">{{ label }}</p>
      <p class="mt-2 text-2xl font-bold tracking-tight text-gray-900">{{ value }}</p>
    </div>
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl {{ color|default:'bg-emerald-50 text-emerald-600' }}">
      {% include "components/icon.html" with name=icon|default:"dashboard" class="w-6 h-6" %}
    </div>
  </div>
  {% if sub %}<p class="mt-2 text-xs text-gray-400">{{ sub }}</p>{% endif %}
</div>
