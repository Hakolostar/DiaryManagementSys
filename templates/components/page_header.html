<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-sm text-gray-500">{{ subtitle }}</p>{% endif %}
  </div>
  {% if button_url_name %}
    <a href="{% url button_url_name %}" class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition">
      <span class="text-base leading-none">+</span> {{ button_label|default:"Add New" }}
    </a>
  {% elif button_url %}
    <a href="{{ button_url }}" class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition">
      <span class="text-base leading-none">+</span> {{ button_label|default:"Add New" }}
    </a>
  {% endif %}
</div>
